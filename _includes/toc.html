<!-- Custom Right-Hand Column Space Weather Panel powered by PyScript -->
<nav class="toc">
  <header><h4 class="nav__title" style="letter-spacing: 0;"><i class="fas fa-satellite-dish"></i> Solar Telemetry</h4></header>
  
  <div style="background: #1e1e24; color: #fff; padding: 15px; border-radius: 6px; font-family: monospace; border: 1px solid #444; width: 100%;">
    <div style="display: flex; flex-direction: column; gap: 12px; font-size: 0.95em;">
      <div><strong>SSN (Sunspots):</strong> <span id="toc-solar-ssn" style="color: #ff9800;">Loading...</span></div>
      <div><strong>SFI (Solar Flux):</strong> <span id="toc-solar-sfi" style="color: #ff9800;">Loading...</span></div>
      <div><strong>Planetary Kp:</strong> <span id="toc-solar-kp" style="color: #ff9800;">Loading...</span></div>
    </div>
  </div>
</nav>

<!-- Load core PyScript runtime directly into the template -->
<link rel="stylesheet" href="https://pyscript.net">
<script type="module" src="https://pyscript.net"></script>

<script type="py">
import json
from pyodide.http import pyfetch
from js import document

async def get_solar_data():
    try:
        # 1. Fetch Sunspot & Solar Flux Index directly (Bypasses browser CORS restrictions natively)
        res1 = await pyfetch("https://noaa.gov")
        data1 = await res1.json()
        latest_row = data1[-1]
        
        ssn_val = str(round(latest_row.get('ssn', 0)))
        sfi_val = str(round(latest_row.get('f10.7', 0)))
        
        ssn_el = document.getElementById('toc-solar-ssn')
        sfi_el = document.getElementById('toc-solar-sfi')
        
        if ssn_el:
            ssn_el.innerText = ssn_val
            ssn_el.style.color = '#69f0ae'
        if sfi_el:
            sfi_el.innerText = sfi_val
            sfi_el.style.color = '#69f0ae'
        
        # 2. Fetch Live Planetary Kp Index status
        res2 = await pyfetch("https://noaa.gov")
        data2 = await res2.json()
        kp_val = data2[-1].get('kp_index', 'N/A')
        
        kp_el = document.getElementById('toc-solar-kp')
        if kp_el:
            kp_el.innerText = str(kp_val)
            # Apply condition warning logic (Red for Storm, Green for Quiet)
            if kp_val != 'N/A' and float(kp_val) >= 4.0:
                kp_el.style.color = '#ff5252'
                kp_el.style.fontWeight = 'bold'
            else:
                kp_el.style.color = '#69f0ae'
                
    except Exception as e:
        print(f"Telemetry layout execution dropped: {e}")
        # Flash fallback error state inside elements
        for element_id in ['toc-solar-ssn', 'toc-solar-sfi', 'toc-solar-kp']:
            el = document.getElementById(element_id)
            if el:
                el.innerText = 'Offline'
                el.style.color = '#ff5252'

# Fire off the data collector script instantly in background layout thread
import asyncio
asyncio.ensure_future(get_solar_data())
</script>
