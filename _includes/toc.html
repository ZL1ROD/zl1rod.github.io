<script type="mpy">
import json
import urllib.parse
from pyscript.fetch import fetch
from js import document

async def get_solar_data():
    try:
        # Use the correct API gateway for the AllOrigins proxy
        proxy_base = "https://api.allorigins.win/get?url="
        
        # 1. Fetch Sunspot & Solar Flux Index from NOAA Space Weather Prediction Center
        # Using SWPC's live "state-of-the-space-environment" json containing recent SFI and SSN
        target1 = urllib.parse.quote("https://services.swpc.noaa.gov/json/state-of-the-space-environment.json")
        data1_raw = await fetch(proxy_base + target1).json()
        
        # AllOrigins wraps the payload as a raw string inside the 'contents' property
        data1 = json.loads(data1_raw['contents'])
        
        # Grab the latest recorded state from the list
        latest_row = data1[-1] if data1 else {}
        
        # SWPC uses 'ssn' for Sunspot Number and 'f10.7' or equivalent indexes
        ssn_val = str(round(latest_row.get('ssn', 0)))
        sfi_val = str(round(latest_row.get('f10.7', 0)))
        
        ssn_el = document.getElementById('toc-solar-ssn')
        sfi_el = document.getElementById('toc-solar-sfi')
        
        if ssn_el:
            ssn_el.innerText = ssn_val
            ssn_el.style.color = '#69f0ae'
        if sfi_el:
            sfi_el.innerText = sfi_val
            sfi_el.style.color = '#69f0ae'
        
        # 2. Fetch Live Planetary Kp Index status
        target2 = urllib.parse.quote("https://services.swpc.noaa.gov/json/planetary_k_index_1m.json")
        data2_raw = await fetch(proxy_base + target2).json()
        
        data2 = json.loads(data2_raw['contents'])
        
        # Grab the latest Kp index reading
        latest_kp = data2[-1] if data2 else {}
        kp_val = latest_kp.get('kp_index', 'N/A')
        
        kp_el = document.getElementById('toc-solar-kp')
        if kp_el:
            kp_el.innerText = str(kp_val)
            if kp_val != 'N/A' and float(kp_val) >= 4.0:
                kp_el.style.color = '#ff5252'
                kp_el.style.fontWeight = 'bold'
            else:
                kp_el.style.color = '#69f0ae'
                
    except Exception as e:
        print("Telemetry routing execution failed:", e)
        for element_id in ['toc-solar-ssn', 'toc-solar-sfi', 'toc-solar-kp']:
            el = document.getElementById(element_id)
            if el:
                el.innerText = 'Offline'
                el.style.color = '#ff5252'

import asyncio
asyncio.create_task(get_solar_data())
</script>
