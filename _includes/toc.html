<!-- PyScript Core Assets -->
<link rel="stylesheet" href="https://pyscript.net/releases/2026.3.1/core.css">
<script type="module" src="https://pyscript.net/releases/2026.3.1/core.js"></script>

<!-- MicroPython Execution Block -->
<script type="mpy">
import json
from pyscript.fetch import fetch
from js import document, console

# Change satellite image on select options
def switch_sdo_image(event):
    channel = event.target.value
    img_element = document.getElementById("sdo-image")
    if img_element:
        img_element.src = f"https://sdo.gsfc.nasa.gov/assets/img/latest/latest_256_{channel}.jpg"

# Bind selection drop-down listener
selector = document.getElementById("sdo-channel-selector")
if selector:
    selector.addEventListener("change", switch_sdo_image)

async def get_solar_data():
    try:
        # NOAA actual direct JSON endpoints (Native CORS Allowed)
        target_indices = "https://services.swpc.noaa.gov/json/solar-cycle/observed-solar-cycle-indices.json"
        target_kp = "https://services.swpc.noaa.gov/json/planetary_k_index_1m.json"
        target_flares = "https://services.swpc.noaa.gov/json/goes/primary/xray-flares-latest.json"
        
        # --- 1. Fetch SSN (Sunspots) & SFI (Solar Flux) ---
        res_ind = await fetch(target_indices)
        if res_ind.status == 200:
            data1 = await res_ind.json()
            latest_row = data1[-1]
            ssn_val = str(round(latest_row.get('ssn', 0)))
            sfi_val = str(round(latest_row.get('f10.7', 0)))
            
            ssn_el = document.getElementById('toc-solar-ssn')
            sfi_el = document.getElementById('toc-solar-sfi')
            
            if ssn_el:
                ssn_el.innerText = ssn_val
                ssn_el.style.color = '#69f0ae'
            if sfi_el:
                sfi_el.innerText = sfi_val
                sfi_el.style.color = '#ffb74d'
        
        # --- 2. Fetch Live Planetary Kp Index status ---
        res_kp = await fetch(target_kp)
        if res_kp.status == 200:
            data2 = await res_kp.json()
            latest_kp = data2[-1]
            kp_raw = latest_kp.get('kp_index', latest_kp.get('kp', 0.0))
            kp_val = float(kp_raw)
            
            kp_el = document.getElementById('toc-solar-kp')
            if kp_el:
                kp_el.innerText = f"{kp_val:.2f}"
                if kp_val >= 5.0:
                    kp_el.style.color = '#ff5252'  # Geomagnetic storm
                    kp_el.style.fontWeight = 'bold'
                elif kp_val >= 4.0:
                    kp_el.style.color = '#ffb74d'  # Active field
                else:
                    kp_el.style.color = '#69f0ae'  # Quiet band conditions
                    
        # --- 3. Fetch Live GOES Solar Flare Intensity ---
        res_flare = await fetch(target_flares)
        if res_flare.status == 200:
            data3 = await res_flare.json()
            latest_flare = data3[-1]
            flare_val = latest_flare.get('max_class', latest_flare.get('current_class', 'A0.0'))
            
            flare_el = document.getElementById('toc-solar-flare')
            if flare_el:
                flare_el.innerText = flare_val
                # Style depending on flare severity
                if flare_val.startswith('X'):
                    flare_el.style.color = '#ff5252'  # Total HF radio blackout
                    flare_el.style.fontWeight = 'bold'
                elif flare_val.startswith('M'):
                    flare_el.style.color = '#ffd740'  # Moderate flare / alerts
                else:
                    flare_el.style.color = '#69f0ae'  # Quiet Sun baseline
                    
    except Exception as e:
        console.error("Telemetry routing execution failed:", str(e))
        for element_id in ['toc-solar-ssn', 'toc-solar-sfi', 'toc-solar-kp', 'toc-solar-flare']:
            el = document.getElementById(element_id)
            if el:
                el.innerText = 'Offline'
                el.style.color = '#ff5252'

import asyncio
asyncio.create_task(get_solar_data())
</script>
