<script type="mpy">
import json
import math
from pyscript.fetch import fetch
from js import window, document

# Resolve encodeURIComponent on the current JS bridge safely
encodeURIComponent = window.encodeURIComponent

# Clean float/int parsers
def parse_numeric(v, default=0.0):
    try:
        return float(v)
    except:
        return default

# Translate raw flux readings from GOES xray channels directly to Class indicators
def get_flare_class(flux):
    if flux <= 0:
        return "A1.0"
    try:
        exp = math.log10(flux)
        if flux < 1e-7:
            # A / B Class borders
            val = flux / 1e-8
            return f"A{val:.1f}" if val < 1.0 else f"B{val/10:.1f}"
        elif flux < 1e-6:
            return f"B{flux/1e-7:.1f}"
        elif flux < 1e-5:
            return f"C{flux/1e-6:.1f}"
        elif flux < 1e-4:
            return f"M{flux/1e-5:.1f}"
        else:
            return f"X{flux/1e-4:.1f}"
    except:
        return "B1.0"

# Main Telemetry Processing Entry
async def retrieve_metrics():
    # Stable proxy router via corsproxy.io (returns raw unaltered JSON payload)
    proxy_url = "https://corsproxy.io/?"
    
    # Secure SWPC NOAA real-time endpoints
    url_indices = "https://services.swpc.noaa.gov/json/solar-cycle/observed-solar-cycle-indices.json"
    url_kp = "https://services.swpc.noaa.gov/json/planetary_k_index_1m.json"
    url_goes = "https://services.swpc.noaa.gov/json/goes/primary/xrays-6-hour.json"

    # Default fallbacks
    sfi = 75.0
    ssn = 15
    kp = 2.0
    flare_str = "B1.2"
    raw_flux = 1.2e-7
    xray_payload = None

    # 1. Fetch SFI (Solar Flux) and SSN (Sunspot Number)
    try:
        response = await fetch(proxy_url + encodeURIComponent(url_indices))
        sfi_payload = await response.json()
        if isinstance(sfi_payload, list) and len(sfi_payload) > 0:
            latest = sfi_payload[-1]
            sfi = parse_numeric(latest.get("f10.7", sfi))
            ssn = int(parse_numeric(latest.get("ssn", ssn)))
            
            document.getElementById("toc-solar-sfi").innerText = str(round(sfi))
            document.getElementById("toc-solar-ssn").innerText = str(ssn)
    except Exception as e:
        print("SFI/SSN fetch error, defaulting:", e)

    # 2. Fetch Geomagnetic Planetary noise index
    try:
        response_kp = await fetch(proxy_url + encodeURIComponent(url_kp))
        kp_payload = await response_kp.json()
        if isinstance(kp_payload, list) and len(kp_payload) > 0:
            kp = parse_numeric(kp_payload[-1].get("kp_index", kp))
            document.getElementById("toc-solar-kp").innerText = f"{kp:.1f}"
    except Exception as e:
        print("Kp fetch error, defaulting:", e)

    # 3. Fetch GOES solar flares current status
    try:
        response_goes = await fetch(proxy_url + encodeURIComponent(url_goes))
        xray_payload = await response_goes.json()
        if isinstance(xray_payload, list) and len(xray_payload) > 0:
            raw_flux = parse_numeric(xray_payload[-1].get("flux", 0.0))
            flare_str = get_flare_class(raw_flux)
            document.getElementById("toc-solar-flare").innerText = flare_str
    except Exception as e:
        print("GOES X-Ray fetch error, defaulting:", e)

    # 4. Color-code primary digital readouts
    # SFI Color indicators
    sfi_el = document.getElementById("toc-solar-sfi")
    container_sfi = document.getElementById("container-sfi")
    if sfi < 70:
        sfi_color, sfi_label, swatch_idx = "#ff5252", "Poor", 0
    elif sfi < 90:
        sfi_color, sfi_label, swatch_idx = "#ffab40", "Fair", 1
    elif sfi < 120:
        sfi_color, sfi_label, swatch_idx = "#ffd740", "Moderate", 2
    elif sfi < 150:
        sfi_color, sfi_label, swatch_idx = "#69f0ae", "Good", 3
    else:
        sfi_color, sfi_label, swatch_idx = "#00e676", "Excellent", 4

    sfi_el.style.color = sfi_color
    container_sfi.style.borderLeftColor = sfi_color
    document.getElementById("sfi-status-label").innerText = sfi_label
    document.getElementById("sfi-status-label").style.color = sfi_color

    # Update active SFI Swatch on the spectrum indicator
    for idx in range(5):
        swatch = document.getElementById(f"swatch-{idx}")
        if swatch:
            if idx == swatch_idx:
                swatch.style.background = sfi_color
                swatch.style.boxShadow = f"0 0 8px {sfi_color}"
                swatch.style.height = "10px"
            else:
                swatch.style.background = "#2b2b36"
                swatch.style.height = "5px"
                swatch.style.boxShadow = "none"

    # SSN Color Indicators
    ssn_el = document.getElementById("toc-solar-ssn")
    container_ssn = document.getElementById("container-ssn")
    if ssn < 15:
        ssn_color = "#9e9e9e"
    elif ssn < 50:
        ssn_color = "#fb8c00"
    else:
        ssn_color = "#00e676"
    ssn_el.style.color = ssn_color
    container_ssn.style.borderLeftColor = ssn_color

    # Kp Color Indicators
    kp_el = document.getElementById("toc-solar-kp")
    container_kp = document.getElementById("container-kp")
    if kp < 3.0:
        kp_color = "#69f0ae"
    elif kp < 4.0:
        kp_color = "#ffd740"
    elif kp < 5.0:
        kp_color = "#fb8c00"
    else:
        kp_color = f"#ff5252"
        kp_el.style.fontWeight = "bold"
    kp_el.style.color = kp_color
    container_kp.style.borderLeftColor = kp_color

    # Flare Class Color indicators
    flare_el = document.getElementById("toc-solar-flare")
    container_flare = document.getElementById("container-flare")
    if flare_str.startswith("M"):
         flare_color = "#fb8c00"
    elif flare_str.startswith("X"):
         flare_color = "#ff5252"
         flare_el.style.fontWeight = "bold"
    else:
         flare_color = "#69f0ae"
    flare_el.style.color = flare_color
    container_flare.style.borderLeftColor = flare_color

    # 5. Combined Band Evaluation Logic (SFI + Kp + Flare activity)
    is_major_flare = flare_str.startswith("M") or flare_str.startswith("X")

    # --- Evaluate 10m ---
    if sfi < 80:
        status_10, color_10 = "Closed", "#ff5252"
    elif sfi < 110:
        status_10, color_10 = ("Poor", "#ff5252") if (kp >= 4 or xray_payload and len(xray_payload) > 0 and raw_flux > 1e-4) else ("Fair", "#ffab40")
    else:
        if kp >= 5 or flare_str.startswith("X"):
            status_10, color_10 = "Closed", "#ff5252"
        elif kp >= 3:
            status_10, color_10 = "Fair", "#ffab40"
        else:
            status_10, color_10 = "Good", "#69f0ae"

    # --- Evaluate 20m ---
    if sfi < 70:
        status_20, color_20 = "Fair", "#ffab40"
    else:
        if kp >= 6 or flare_str.startswith("X"):
            status_20, color_20 = "Poor", "#ff5252"
        elif kp >= 4:
            status_20, color_20 = "Fair", "#ffab40"
        else:
            status_20, color_20 = "Good", "#69f0ae"

    # --- Evaluate 40m ---
    if kp >= 5 or is_major_flare:
        status_40, color_40 = "Poor", "#ff5252"
    elif kp >= 3:
        status_40, color_40 = "Fair", "#ffab40"
    else:
        status_40, color_40 = "Good", "#69f0ae"

    # --- Evaluate 80m ---
    if kp >= 4 or is_major_flare:
        status_80, color_80 = "Poor", "#ff5252"
    elif kp >= 2:
        status_80, color_80 = "Fair", "#ffab40"
    else:
        status_80, color_80 = "Good", "#69f0ae"

    # Apply Band matrix updates
    for band, val, col in [("10m", status_10, color_10), ("20m", status_20, color_20), ("40m", status_40, color_40), ("80m", status_80, color_80)]:
        document.getElementById(f"status-{band}").innerText = val
        document.getElementById(f"status-{band}").style.color = col
        document.getElementById(f"led-{band}").style.backgroundColor = col
        document.getElementById(f"led-{band}").style.boxShadow = f"0 0 6px {col}"

    # 6. Generate dynamic telemetry bulletin
    bulletin = ""
    if kp >= 5:
        bulletin = f"⚠️ Major Geomagnetic Storm active (Kp={kp:.0f}). High absorption levels and noisy channels expected. Low bands severely degraded."
    elif flare_str.startswith("X"):
        bulletin = f"🚨 Solar flare ({flare_str}) active. Standard Sudden Ionospheric Disturbances (SIDs) might attenuate signals across 40m - 80m."
    elif flare_str.startswith("M"):
        bulletin = f"⚠️ Flare event ({flare_str}) in progress. Focus on upper bands while lower-frequency signals may suffer absorption."
    else:
        if sfi >= 130:
            if kp < 3:
                bulletin = f"✨ Propagation conditions are excellent! SFI ({int(sfi)}) is high and the geomagnetic field is quiet. Amazing daytime DX on 10m-20m."
            else:
                bulletin = f"📈 Large SFI ({int(sfi)}) is boosting ionization. However, Kp={kp:.1f} signifies high noise levels."
        elif sfi >= 95:
            if kp < 3:
                bulletin = f"🟢 Quiet geomagnetic field ensures very stable channels. High F2 charge supports clear, long-distance 20m/40m propagation."
            else:
                bulletin = f"🟡 Moderate solar flux (SFI={int(sfi)}), with marginal noise thresholds. Solid 20m contacts are easily viable."
        else:
            if kp < 3:
                bulletin = f"🔵 Low solar flux. Upper bands closed; focus on lower bands (40m-80m) which are exceptionally quiet and open for night DX."
            else:
                bulletin = f"📉 Low solar activity paired with geomagnetic instability. Expect marginal contacts on lower bands."
    
    document.getElementById("solar-assessment").innerText = bulletin

# Schedule and run async telemetry update task
import asyncio
asyncio.create_task(retrieve_metrics())
</script>
